name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Run by hand (Actions → CI → Run workflow) to get macOS and Linux builds to try
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Ubuntu 24.04 blocks the unprivileged user namespaces that Electron's
      # sandbox needs; allow them for this job
      - name: Allow Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Library tests
        run: xvfb-run -a npm test

      - name: App smoke test
        run: xvfb-run -a npm run test:app

      # For Linux and the Steam Deck's desktop mode, on version tags and manual runs
      - name: Build the AppImage
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --linux --publish never

      - name: Upload the AppImage
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mini-vtt-linux
          path: release/*.AppImage
          if-no-files-found: error

  # The same tests on a Mac, since there is none to test on by hand. The .dmg
  # is only built for version tags and manual runs, to save macOS minutes.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Library tests
        run: npm test

      - name: App smoke test
        run: npm run test:app

      - name: Build the .dmg (unsigned)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the .dmg
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mini-vtt-mac
          path: release/*.dmg
          if-no-files-found: error
