name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Ubuntu 24.04 blocks the unprivileged user namespaces that Electron's
      # sandbox needs; allow them for this job
      - name: Allow Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Library tests
        run: xvfb-run -a npm test

      - name: App smoke test
        run: xvfb-run -a npm run test:app
